name: kilowatts_mobile
description: "Kilowatts solar energy monitoring, load management and installer operations application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  shared_preferences: ^2.5.3
  mqtt_client: ^10.9.1
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/kilowatts_logo_transparent.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/kilowatts_logo_safe_zone.png"
  adaptive_icon_foreground_inset: 0

flutter_native_splash:
  color: "#ffffff"
  image: assets/branding/kilowatts_logo_transparent.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#ffffff"
    image: assets/branding/kilowatts_logo_safe_zone.png

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
